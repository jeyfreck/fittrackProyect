spring.application.name=fittrack
server.port=${SERVER_PORT:8080}

# Database Configuration with Environment Variable Injection & Secure Defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fittrackdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OpenAPI / Swagger 3 Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# JWT Cryptographic Configuration (High-Entropy 256-Bit HMAC-SHA256 Secret Key)
# Default is a 256-bit Base64-encoded secret key if JWT_SECRET environment variable is not defined
app.jwt.secret=${JWT_SECRET:c3VwZXItc2VjdXJlLWZpdHRyYWNrLTNkLWN5YmVybmV0aWMtcHJvamVjdC1rZXktMjAyNi0yNTYtYml0cw==}
# Access token expiration: 1 hour (3600000ms), Refresh token: 7 days (604800000ms)
app.jwt.expiration=${JWT_EXPIRATION:3600000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration (Restricted Explicit Origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Security Rate Limiting (Brute-Force & DoS Mitigation)
app.security.rate-limit.max-per-minute=${RATE_LIMIT_PER_MINUTE:30}

